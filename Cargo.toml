[package]
name = "android_destroy_recreate_demo"
version = "0.1.0"
edition = "2024"

[dependencies]
# Disable multi_threaded feature because on my testing devices:
#
# # Samsung Galaxy A33 (Android 16)
# Setting device fps to 90 is not an issue for this simple app but for just slightly bigger apps
# with more systems the fps are unstable which ist not a nice experience. Single-threaded it runs
# smooth.
#
# # Samsung Galaxy S20 (Android 13)
# Same issue as the device above just with 120 fps.
bevy = {
    git = "https://github.com/Johannes0021/bevy.git",
    branch = "android-destroy-recreate",
    default-features = false,
    features = [
        "2d_bevy_render",
        "android-game-activity",
        "default_app",

        # default_platform
        "std",
        "bevy_winit",
        #"multi_threaded",
        "webgl2",
        "x11",
        "wayland",
        "sysinfo_plugin",
    ],
}

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false

[patch.crates-io]
# See
# https://github.com/bevyengine/bevy/issues/16798
# and https://github.com/rust-mobile/android-activity/issues/175
android-activity = {
    git = "https://github.com/Johannes0021/android-activity.git",
    branch = "game-activity-patch-v0.6.1",
}
# To allow the recreation on winits side:
# This is not my work I took it from:
# https://github.com/rib/winit/commit/c28e425214e82bdb86dcdf89c9488554a18e24b2
winit = {
    git = "https://github.com/Johannes0021/winit.git",
    branch = "android-destroy-recreate-v0.30.13",
}
